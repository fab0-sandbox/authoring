# yaml-language-server: $schema=https://schema.fab0.dev/pipeline.v1.json
version: 1
name: feature-stories
description: A planner breaks a Feature into Stories; each Story is implemented and reviewed by a person, and the Feature is done when its Stories are.
people:
  leads: [eugenefurs]
status:
  labels: [Todo, Ready, InProgress, InReview, Done]
  end: Done
start: { type: Feature, status: Ready, by: [leads] }
escalate: [leads]
types:
  Feature:
    steps:
      plan:
        on: { status: Ready }
        do: agent.routine
        skill: plan-feature
        model: large
        makes: issues
        spawn: { type: Story, budget: 10 }
        approve: { human: [leads], via: command }
        on_done: [{ label: InProgress }]
      close:
        on: { children: { type: Story, all: Done } }
        do: github.label
        label: Done
  Story:
    parent: Feature
    steps:
      implement:
        on: { status: Ready }
        do: agent.record
        skill: implement
        by: [leads]
        makes: pr
        approve: { human: [leads], via: merge }
        on_done: [{ label: Done }]
